<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Challenge Generator</title>
  <link rel="stylesheet" href="stylesheet.css">
</head>
<header id="site-project-header">
  <h1 class="site-title"><a href="../../index.html">My Developer Portfolio</a></h1>
  <nav>
    <a href="../../aboutMe.html">About</a>
    <a href="../../projects.html">My Projects</a>
    <a href="../../skills.html">My Skills</a>
    <a href="../../miscellaneous.html">Miscellaneous</a>
  </nav>
  <button class="reset" id="resetButton">Reset</button>
</header>
<body>
  <div class="container">
    <div class="language_selector">
      <img class="language_button" id="english" src="../../assets/national-flag-of-uk.jpg">
      <img class="language_button" id="french" src="../../assets/flag-of-France.webp">
    </div>
    <h2 id="hardModeTitle">Hard mode</h2>
    <button type="checkbox" class="hardMode" id="hardModeButton">OFF</button>
    <h1 id="Challenge-generator-title">Challenge Generator</h1>
    <div class="challenge-box" id="challengeBox">
      <div class="activity" id="activity">Press "Generate Challenge"</div>
      <div class="challenge" id="challenge"></div>
    </div>
    <button class="generate" id="generateButton">Generate Challenge</button>
    <div class="actions">
      <button class="success" id="successButton">✅ Completed</button>
      <button class="fail" id="failButton">❌ Failed</button>
      <button class="skip" id="skipButton">⏭️ Skip</button>
    </div>
    <div class="counters", id="counters">
      <div  class="countersDisplay" id="completedCountText">✅ Completed <span id="completedCount">0</span></div>
      <div class="countersDisplay" id="failedCountText">❌ Failed <span id="failedCount">0</span></div>
      <div class="countersDisplay" id="skipCountText">⏭️ Skips <span id="skipsCount">5</span></div>
    </div>
  </div>
</body>
<script src="script.js"></script>
</html>
